<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center p-5">

    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-lg text-center">
        <h2 class="text-3xl font-bold text-green-700 mb-4">
            Predicted GDP
        </h2>

        <p class="text-5xl font-bold text-gray-900 mb-6">
            {{ prediction }} 
            <span class="text-xl text-gray-600">Billions USD</span>
        </p>

        <a href="/" 
           class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-800 transition">
            Predict Again
        </a>
    </div>

</body>
</html>
