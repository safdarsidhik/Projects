<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDP Prediction</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center p-5">

    <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-lg">
        <h2 class="text-3xl font-bold text-center text-blue-700 mb-6">
            GDP Prediction (in Billions USD)
        </h2>

        <form action="/predict" method="POST" class="space-y-5">

            <!-- Exports -->
            <div>
                <label class="block font-semibold mb-1">
                    Exports of Goods (% of GDP)
                </label>
                <input type="number" step="0.000000001" name="exports_pct" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Imports -->
            <div>
                <label class="block font-semibold mb-1">
                    Imports of Goods (% of GDP)
                </label>
                <input type="number" step="0.000000001" name="imports_pct" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Population -->
            <div>
                <label class="block font-semibold mb-1">
                    Population (Exact Number)
                </label>
                <input type="number" step="1" name="population" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- FDI -->
            <div>
                <label class="block font-semibold mb-1">
                    Foreign Direct Investment (% of GDP)
                </label>
                <input type="number" step="0.000000001" name="fdi_pct" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Government Expenditure -->
            <div>
                <label class="block font-semibold mb-1">
                    Government Final Consumption Expenditure (% of GDP)
                </label>
                <input type="number" step="0.000000001" name="govt_exp_pct" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Oil Rents -->
            <div>
                <label class="block font-semibold mb-1">
                    Oil Rents (% of GDP)
                </label>
                <input type="number" step="0.000000001" name="oil_rents_pct" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Exchange Rate -->
            <div>
                <label class="block font-semibold mb-1">
                    Official Exchange Rate (LCU per USD)
                </label>
                <input type="number" step="0.000000001" name="exchange_rate" required
                       class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button 
                class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-800 transition">
                Predict GDP
            </button>
        </form>
    </div>

</body>
</html>
