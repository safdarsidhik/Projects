<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDP Prediction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex justify-center items-center p-5">

    <div class="bg-white/80 backdrop-blur-sm shadow-2xl rounded-2xl p-8 w-full max-w-2xl border border-white/20">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-full mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
            <h2 class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-2">
                GDP Prediction
            </h2>
            <p class="text-gray-600">Enter economic indicators to predict GDP in billions USD</p>
        </div>

        <form action="/predict" method="POST" class="space-y-6">

            <!-- Trade Section -->
            <div class="bg-gradient-to-r from-blue-50 to-indigo-50 p-5 rounded-xl border border-blue-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    International Trade
                </h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Exports of Goods (% of GDP)
                        </label>
                        <input type="number" step="0.000000001" name="exports_pct" required
                               placeholder="e.g., 25.5"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Imports of Goods (% of GDP)
                        </label>
                        <input type="number" step="0.000000001" name="imports_pct" required
                               placeholder="e.g., 30.2"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                </div>
            </div>

            <!-- Demographics & Investment -->
            <div class="bg-gradient-to-r from-purple-50 to-pink-50 p-5 rounded-xl border border-purple-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    Demographics & Investment
                </h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Population
                        </label>
                        <input type="number" step="1" name="population" required
                               placeholder="e.g., 50000000"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Foreign Direct Investment (% of GDP)
                        </label>
                        <input type="number" step="0.000000001" name="fdi_pct" required
                               placeholder="e.g., 3.5"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                </div>
            </div>

            <!-- Government & Resources -->
            <div class="bg-gradient-to-r from-green-50 to-emerald-50 p-5 rounded-xl border border-green-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    Government & Resources
                </h3>
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Government Final Consumption (% of GDP)
                        </label>
                        <input type="number" step="0.000000001" name="govt_exp_pct" required
                               placeholder="e.g., 18.5"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-2 text-sm">
                            Oil Rents (% of GDP)
                        </label>
                        <input type="number" step="0.000000001" name="oil_rents_pct" required
                               placeholder="e.g., 5.2"
                               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white">
                    </div>
                </div>
            </div>

            <!-- Exchange Rate -->
            <div class="bg-gradient-to-r from-amber-50 to-orange-50 p-5 rounded-xl border border-amber-100">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    Currency Exchange
                </h3>
                <div>
                    <label class="block font-medium text-gray-700 mb-2 text-sm">
                        Official Exchange Rate (LCU per USD)
                    </label>
                    <input type="number" step="0.000000001" name="exchange_rate" required
                           placeholder="e.g., 1.25"
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition bg-white">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl font-semibold text-lg hover:from-blue-700 hover:to-indigo-700 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 flex items-center justify-center group">
                <span>Predict GDP</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
                </svg>
            </button>
        </form>

        <!-- Footer Info -->
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>All fields are required for accurate prediction</p>
        </div>
    </div>

</body>
</html>
